name: CI/CD

on:
  push:
    branches: [main]

jobs:
  ci-cd:
    runs-on: self-hosted
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (gate)
        run: dotnet build -c Release --no-restore

      - name: Test
        run: |
          if find . -name '*.csproj' | xargs grep -lq 'Microsoft.NET.Test.Sdk'; then
            dotnet test -c Release --no-build
          else
            echo "Sin proyecto de tests todavía — skip"
          fi

      - name: Publish
        run: dotnet publish src/AnilistConEnie.Bot -c Release --no-build -o "$HOME/bots/AnilistConEnie-app"

      - name: Restart
        run: systemctl --user restart anilistconenie
