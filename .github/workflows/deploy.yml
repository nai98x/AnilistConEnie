name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Escaneo de dependencias vulnerables
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerables.txt
          if grep -q "has the following vulnerable packages" vulnerables.txt; then
            echo "::error::Se detectaron paquetes con vulnerabilidades conocidas"
            exit 1
          fi

      - name: Build (gate)
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish
        run: dotnet publish src/AnilistConEnie.Bot -c Release -r linux-arm64 --no-self-contained -o ./publish

      - name: Empaquetar artefacto
        run: tar czf publish.tar.gz -C ./publish .

      - name: Copiar artefacto al server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          source: publish.tar.gz
          target: ~/bots

      - name: Desplegar y reiniciar
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            bash -c 'set -e; export XDG_RUNTIME_DIR="/run/user/$(id -u)"; APP="$HOME/bots/AnilistConEnie-app"; systemctl --user stop anilistconenie || true; mkdir -p "$APP"; find "$APP" -mindepth 1 -maxdepth 1 ! -name logs -exec rm -rf {} +; tar xzf "$HOME/bots/publish.tar.gz" -C "$APP"; rm -f "$HOME/bots/publish.tar.gz"; chmod +x "$APP/AnilistConEnie.Bot"; systemctl --user start anilistconenie'
